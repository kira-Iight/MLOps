# Единственная точка конфигурации ДЗ 3.
# Ни один путь, порог или размер среза не должен появляться в коде строкой.

collect:
  # Версия датасета переключается ЗДЕСЬ. Всё остальное — следствие.
  version: "v2"              # v1 | v2
  n_rows: 3000               # строк, берём из каждого файла-источника ПОСЛЕ фильтров
  sources:
    v1:
      - "Kessel/bbcnews"   # v1: только train-сплит
    v2:
      - "Kessel/bbcnews"   # v2: тот же датасет, но больше примеров
      - "fancyzhx/ag_news"

  # --- Переработка источника ---
  # Чужой готовый набор — это сырьё, а не сдача (см. README, «Готовый датасет
  # как источник»). Три параметра ниже — то, чем эталон отличается от «скачал
  # parquet и переименовал в raw.jsonl». Каждый из них обязан быть отражён
  # в docs/datasheet.md.

  topics: null               # null — все темы источника;
                             # список тем — сузить набор до своей предметной области.
                             # Сужение — законная переработка, но следите за
                             # diversity.min_groups: одна тема не датасет.

  verify_answer_index: false  # сверять ответ ассистента с correct_choice_indices
                             # источника. Чужую разметку не принимаем на веру:
                             # расхождение — строка выбрасывается и попадает в счётчик.

  system_prompts:            # В источнике системный промпт ОДИН на все 384k строк.
                             # Модель, обученная на одной формулировке инструкции,
                             # заучивает её как константу и ломается от перефраза.
                             # Поэтому инструкция разведена на варианты; вариант
                             # выбирается детерминированно по id примера.

    - "Ты классифицируешь новости по темам. Прочитай текст и назови одну из категорий: business, entertainment, politics, sport, tech."
    - "Перед тобой новостной текст. Определи его категорию: business, entertainment, politics, sport или tech. Ответь одной строкой."
    - "Задача: отнести новость к одной из пяти категорий — business, entertainment, politics, sport, tech."
    - "Ты помогаешь редактору размечать новости. Прочитай текст и выбери категорию: business, entertainment, politics, sport или tech."
    - "Определи тематику новости. Варианты: business, entertainment, politics, sport, tech. Ответь только названием категории."

clean:
  # Фильтр длин: слишком короткий пример — обрезок, слишком длинный — выброс.
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4         # длина словного шингла
    num_perm: 64             # перестановок MinHash: точность против скорости
    threshold: 0.85          # Жаккар выше порога — почти-дубль
  pii:
    enabled: true            # стадия обязательна, даже если счётчик нулевой

diversity:
  # Пороги адаптированы под задачу КЛАССИФИКАЦИИ НОВОСТЕЙ BBC (5 категорий).
  # Ответы — это метки классов («Категория: business» и т.п.), они ЗАКОННО
  # однотипные. Обоснование — в docs/datasheet.md.
  min_examples: 1000         # ≥ 1000 строк после очистки (по заданию)
  min_system_prompts: 3      # 5 вариантов инструкции (взято из system_prompts)
  min_groups: 5              # BBC News — ровно 5 категорий
  max_group_share: 0.30      # крупнейшая категория ~24% (business)
  min_answer_len_ratio: 1.05 # ответы — метки классов, почти одной длины
  max_same_length_share: 0.60 # ~43% ответов одной длины — норма для меток
  max_duplicate_answer_share: 0.999  # 5 категорий → 99.5% ответов повторяются

split:
  group_key: "topic"
  # BBC News содержит только 5 категорий — групповой сплит по topic даёт
  # всего 5 групп, чего не хватает для пропорций 80/10/10 (val получается пустым).
  # Поэтому каждая тема разбивается ещё на N подгрупп по хэшу id.
  # 5 тем × 10 подгрупп = 50 групп — достаточно для честного сплита.
  group_granularity: 10
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  # Порог поиска near-dup пересечений train/test.
  # Обязан совпадать с clean.near_dup.threshold. Более строгий порог здесь
  # ловил бы не контаминацию, а разницу порогов: пары с Жаккаром между
  # порогом чистки и порогом проверки очистку проходят законно.
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
